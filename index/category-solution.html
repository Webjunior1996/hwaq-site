{include file="index/header"/}
{include file="index/header-nav"/}
<!--=====================INNER BANNER=====================-->
<div class="inner-banner pre">
    <div class="ui container pl-50 pr-50 flex-ac flex">
        <div class="bannerLine"></div>
        <div class="pt-100 pb-20">
            <div class="catTitle font-60">
                {$cat_detail['cat_name']}
            </div>
            <div class="mbx Auxil-crumbs mt-10 flex font-16">
                <div class="sub mr-10"></div>
                <div class="mbxC Auxil-crumbs">
                    {:get_link()}
                </div>
            </div>
        </div>
    </div>
</div>
<!--=====================MAIN CONTENT=====================-->
<div class="inner-page case-page pt-100 pb-80">
    <div class="ui container">
        <ul class="grid grid-2 slickGap-30">
            {article item="vo" child="1" limit="10"}
            <li class="column mb-30">
                <a rel="nofollow" href="{$vo.url}" class="img-box block radius-20">
                    <img src="{$vo.thumb}" alt="{$vo.title}">
                </a>
                <p class="font-18 txt-center mt-10"><a rel="nofollow" href="{$vo.url}">{$vo.title}</a></p>
            </li>
            {/article}
        </ul>
        <div class="m-page">{$pager}</div>
    </div>
</div>
<!--/.wrapper-->
{include file="index/footer"/}
