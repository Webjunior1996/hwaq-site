{include file="index/header"/}
{include file="index/header-nav"/}
<!--=====================INNER BANNER=====================-->
<div class="inner-banner pre">
    <div class="ui container pl-50 pr-50 flex-ac flex">
        <div class="bannerLine"></div>
        <div class="pt-100 pb-20">
            <div class="catTitle font-60">
                {$cat_detail['cat_name']}
            </div>
            
            <div class="mbx Auxil-crumbs mt-10 flex font-16">
                <div class="sub mr-10"></div>
                <div class="mbxC Auxil-crumbs">
                    {:get_link()}
                </div>
            </div>
        </div>
    </div>
</div>
<!--=====================MAIN CONTENT=====================-->
<div class="factory-page inner-page pt-120 pb-120">
    <div class="ui container">
        <ul class="grid grid-4 flexGap-30">
            {article item="vo" limit="12" child="1" no_p="1" page_num="5"}
            <li><a href="{$vo.url}"><img src="{$vo.thumb}" alt="{$vo.title}"></a></li>
            {/article}
        </ul>
        <div class="m-page">
            {$pager}
        </div>
    </div>
</div>
<!--/.wrapper-->
{include file="index/footer"/}
